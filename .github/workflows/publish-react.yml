name: Publish React package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@idenflu'
      - name: Check release changelog
        run: npm run check:changelog
      - run: npm ci
        working-directory: packages/idenflu-mono-react
      - run: npm run typecheck
        working-directory: packages/idenflu-mono-react
      - run: npm test
        working-directory: packages/idenflu-mono-react
      - run: npm run test:package-isolation
      - run: npm pack --dry-run
        working-directory: packages/idenflu-mono-react
      - run: npm run test:package -- --skip-build
      - run: npm publish
        working-directory: packages/idenflu-mono-react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
