name: Design system quality
on:
  push:
    branches: [deploy]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  react-package:
    if: github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/react/package-lock.json
      - run: npm ci
        working-directory: packages/react
      - run: npm run typecheck
        working-directory: packages/react
      - run: npm test
        working-directory: packages/react
      - run: npm run studio:build
        working-directory: packages/react
      - run: npm run studio:check
        working-directory: packages/react
  verify:
    if: github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: packages/react
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npx playwright test --config packages/react/studio/playwright.config.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: |
            playwright-report/
            test-results/
            packages/react/test-results/
            dist/
          retention-days: 14
