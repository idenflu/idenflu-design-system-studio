name: Design system quality
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  react-package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/mono-react/package-lock.json
      - run: npm ci
        working-directory: packages/mono-react
      - run: npm run typecheck
        working-directory: packages/mono-react
      - run: npm test
        working-directory: packages/mono-react
      - run: npm run studio:build
        working-directory: packages/mono-react
      - run: npm run studio:check
        working-directory: packages/mono-react
      - run: npm run check:api
      - run: npm run test:package
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/mono-react/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: packages/mono-react
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node packages/mono-react/scripts/build-studio.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: |
            playwright-report/
            test-results/
            packages/mono-react/test-results/
            dist/
          retention-days: 14
  studio-browser:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/mono-react/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: packages/mono-react
      - run: npm run build
      - run: node packages/mono-react/scripts/build-studio.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config systems/idenflu-mono/studio/playwright.config.cjs --shard=${{ matrix.shard }}/4 --workers=2 --reporter=line,html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-studio-${{ matrix.shard }}
          path: |
            playwright-report/
            packages/mono-react/test-results/
            systems/idenflu-mono/studio/test-results/
          retention-days: 14
  browser-engines:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/mono-react/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: packages/mono-react
      - run: npm run build
      - run: node packages/mono-react/scripts/build-studio.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:compat -- --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-browser-engines
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  react-compatibility:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        react: ['18.3.1', '19.2.0']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/mono-react/package-lock.json
      - run: npm ci
        working-directory: packages/mono-react
      - run: npm run build
        working-directory: packages/mono-react
      - run: npm run test:react-compat -- --react=${{ matrix.react }}
