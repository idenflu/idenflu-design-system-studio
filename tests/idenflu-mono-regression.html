<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>idenflu mono 회귀 테스트</title>
    <style>
      body { margin: 32px auto; padding: 0 24px; max-width: 1120px; font: 14px/1.6 system-ui, sans-serif; color: #181c22; }
      h1 { font-size: 24px; }
      button { padding: 8px 16px; font: inherit; }
      li { margin: 8px 0; }
      [data-result="passed"] { color: #38754d; }
      [data-result="failed"] { color: #b52e2e; }
      iframe { width: 100%; height: 640px; margin-top: 24px; border: 1px solid #c6c6cc; }
    </style>
    <script src="./idenflu-mono-regression.js" defer></script>
  </head>
  <body>
    <h1>idenflu mono 회귀 테스트</h1>
    <p>실제 문서를 새 iframe에 불러와 드로어·날짜 선택기·폼의 오류 복구와 초기화를 검증합니다.</p>
    <button id="run-tests" type="button">다시 실행</button>
    <p id="test-summary" role="status">테스트 준비 중</p>
    <ol id="test-results"></ol>
    <iframe id="test-app" title="회귀 테스트 대상 문서"></iframe>
  </body>
</html>
